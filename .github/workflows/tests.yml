name: CI
on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    env:
      HOMEBREW_DEVELOPER: 1
      HOMEBREW_NO_INSTALL_FROM_API: 1
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            container: ghcr.io/homebrew/ubuntu24.04:main
          - os: macos-latest
    steps:
      - uses: Homebrew/actions/setup-homebrew@main

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew style cblecker/tap --except-cops Layout/LineLength

      - run: brew audit --tap cblecker/tap --skip-style --except specs

      - name: Install JQ
        if: matrix.os == 'macos-latest'
        run: brew install jq

      - name: Detect formulae to test
        id: formulae-detect
        run: |
          # Try automatic detection first, fall back to manual listing if it fails
          if ! brew test-bot --only-formulae-detect 2>&1; then
            # shellcheck disable=SC2086
            echo "testing_formulae=$(brew tap-info cblecker/tap --json | jq -r -f test_exemptions.jq)" >> $GITHUB_OUTPUT
          fi

      - name: Run brew test-bot --only-formulae --junit --only-json-tab --skip-dependents --testing-formulae=${{ steps.formulae-detect.outputs.testing_formulae }}
        id: brew-test-bot-formulae
        run: brew test-bot --only-formulae --junit --only-json-tab --skip-dependents --testing-formulae=${{ steps.formulae-detect.outputs.testing_formulae }}

      - name: Check for formula failures
        run: |
          if compgen -G "failed/*.json" > /dev/null 2>&1; then
            echo "::error::Formula test failures detected:"
            ls -la failed/
            exit 1
          fi
          # This tap ships no bottles, so test-bot marks every build/test step
          # ignore_failures (!bottled_on_current_version) and still exits 0 when
          # `brew install` fails. A step is only reported as ignored if it did
          # fail, so this cannot fire on a benign skip.
          if [ -f steps_output.txt ] && grep -qE "failed steps? ignored!" steps_output.txt; then
            echo "::error::brew test-bot ignored a failed step:"
            cat steps_output.txt
            exit 1
          fi

      - name: Run brew test-bot --only-formulae-dependents --junit --skipped-or-failed-formulae=${{ steps.brew-test-bot-formulae.outputs.skipped_or_failed_formulae }}
        run: |
          brew test-bot --only-formulae-dependents --junit \
                        --testing-formulae=${{ steps.formulae-detect.outputs.testing_formulae }} \
                        --skipped-or-failed-formulae=${{ steps.brew-test-bot-formulae.outputs.skipped_or_failed_formulae }}

      # Each test-bot invocation rewrites steps_output.txt, so the check above
      # only covers the formulae run. Dependents built from this tap are also
      # unbottled, so their failures are ignored the same way.
      - name: Check for dependent failures
        run: |
          if [ -f steps_output.txt ] && grep -qE "failed steps? ignored!" steps_output.txt; then
            echo "::error::brew test-bot ignored a failed dependent step:"
            cat steps_output.txt
            exit 1
          fi

      - name: Output brew test-bot failures
        if: always()
        run: |
          if [ -f steps_output.txt ]; then
            {
              echo "### Test output"
              echo '```'
              sed 's/\x1B\[[0-9;]\{1,\}[A-Za-z]//g' steps_output.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            rm steps_output.txt
          fi

      - name: Output brew bottle output
        if: always()
        run: |
          if [ -f bottle_output.txt ]; then
            {
              echo "<details><summary>Bottle output</summary>"
              echo '```'
              sed 's/\x1B\[[0-9;]\{1,\}[A-Za-z]//g' bottle_output.txt
              echo '```'
              echo "</details>"
            } >> "$GITHUB_STEP_SUMMARY"
            rm bottle_output.txt
          fi

      - name: Run brew test-bot --only-cleanup-after
        run: brew test-bot --only-cleanup-after

  conclusion:
    needs: tests
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check test results
        env:
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          result="${TESTS_RESULT}"
          printf '::notice ::tests job status: %s\n' "$result"

          if [[ "$result" = "failure" ]] || [[ "$result" = "cancelled" ]]
          then
            printf '::error ::tests job %s.\n' "$result"
            exit 1
          fi
