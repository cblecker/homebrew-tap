name: Bump and PR
description: Bumps a formula version and creates an auto-merge PR

inputs:
  formula:
    description: Formula name
    required: true
  tag:
    description: Git tag (e.g. v1.2.3)
    required: true
  version:
    description: Version string for PR title/body
    required: true
  branch:
    description: PR branch name
    required: true
  body:
    description: PR body text
    required: true
  app-id:
    description: GitHub App client ID
    required: true
  app-private-key:
    description: GitHub App private key
    required: true

runs:
  using: composite
  steps:
    - name: Generate App Token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.app-private-key }}

    - name: Bump formula
      id: bump
      shell: bash
      env:
        FORMULA: ${{ inputs.formula }}
        TAG: ${{ inputs.tag }}
      run: |
        field() { grep "${1}:" "Formula/${FORMULA}.rb" | head -1 | sed 's/.*'"${1}"': *"\(.*\)".*/\1/'; }
        echo "old-tag=$(field tag)" >> "$GITHUB_OUTPUT"
        echo "old-revision=$(field revision)" >> "$GITHUB_OUTPUT"
        ./scripts/bump-formula.sh "${FORMULA}" "${TAG}"
        echo "new-revision=$(field revision)" >> "$GITHUB_OUTPUT"

    - name: Write PR body
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FORMULA: ${{ inputs.formula }}
        TAG: ${{ inputs.tag }}
        BODY: ${{ inputs.body }}
        OLD_TAG: ${{ steps.bump.outputs.old-tag }}
        OLD_REV: ${{ steps.bump.outputs.old-revision }}
        NEW_REV: ${{ steps.bump.outputs.new-revision }}
      run: |
        REPORT=$(./scripts/bump-report.sh "${FORMULA}" "${OLD_TAG}" "${OLD_REV}" "${TAG}" "${NEW_REV}")
        printf '%s\n\n%s\n' "${BODY}" "${REPORT}" > "${RUNNER_TEMP}/pr-body.md"

    - name: Create Pull Request
      id: create-pr
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ steps.app-token.outputs.token }}
        branch: ${{ inputs.branch }}
        delete-branch: true
        title: "${{ inputs.formula }} ${{ inputs.version }}"
        body-path: ${{ runner.temp }}/pr-body.md
        commit-message: "${{ inputs.formula }} ${{ inputs.version }}"

    - name: Enable auto-merge
      if: steps.create-pr.outputs.pull-request-number
      shell: bash
      env:
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        PR_NUMBER: ${{ steps.create-pr.outputs.pull-request-number }}
        GH_REPO: ${{ github.repository }}
      run: gh pr merge --auto --squash "$PR_NUMBER" --repo "${GH_REPO}"
